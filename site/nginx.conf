server {
    listen 80;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/ld+json application/manifest+json image/svg+xml;

    # За проксі: відносні редиректи, щоб не втратити https і домен
    absolute_redirect off;

    # Файли з хешем у назві (Vite) — кешуємо назавжди
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Зображення, відео, іконки з public/
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # Прибираємо слеш у кінці, щоб у кожної сторінки була одна адреса
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Сторінки квартир: пре-рендер, а для нових квартир (додані після збірки) — SPA
    location ~ ^/(short|long)-term-rent/[^/]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /app-shell.html;
    }

    # Решта сторінок: пре-рендер або справжній 404 (без «м'яких 404»)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
